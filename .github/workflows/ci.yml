name: CI

on:
  push:
    branches: [dev, test, main, 'codex/**']
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce protected promotion graph
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then exit 0; fi
          if [[ "$BASE_REF" =~ ^(test|main)$ && "$HEAD_REPO" != "$REPOSITORY" ]]; then exit 1; fi
          if [[ "$BASE_REF" == "test" && "$HEAD_REF" != "dev" ]]; then exit 1; fi
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "test" ]]; then exit 1; fi

  test:
    runs-on: ubuntu-latest
    needs: guard
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      PYTHONDONTWRITEBYTECODE: 1
      SAM_CLI_TELEMETRY: 0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned runtime and test tooling
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt PyYAML==6.0.2 pip-audit==2.10.1 aws-sam-translator==1.111.0
          python -m pip_audit -r src/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Validate local-only SAM scaffold
        run: |
          sam validate --lint
          sam build --no-cached
          python tests/verify_sam_build.py
