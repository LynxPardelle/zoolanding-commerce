AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic draft-scoped Commerce service.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - test
      - production
  IntegrationsApiId:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedValues:
      - /zoolanding/test/services/integrations/api-id
      - /zoolanding/production/services/integrations/api-id
  ConfigRegistryTableName:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedValues:
      - /zoolanding/test/config/registry-table-name
      - /zoolanding/production/config/registry-table-name
  ConfigPayloadsBucketName:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedValues:
      - /zoolanding/test/config/payload-bucket-name
      - /zoolanding/production/config/payload-bucket-name
  AuthSessionTableName:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedValues:
      - /zoolanding/test/auth/session-table-name
      - /zoolanding/production/auth/session-table-name
  AuthUserStateTableName:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedValues:
      - /zoolanding/test/auth/user-state-table-name
      - /zoolanding/production/auth/user-state-table-name
  IntegrationEventsTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    AllowedValues:
      - /zoolanding/test/topics/integration-events-arn
      - /zoolanding/production/topics/integration-events-arn
  FiscalProductionApproved:
    Type: String
    AllowedValues:
      - 'false'
      - 'true'
    Default: 'false'
  FiscalRetentionApprovalId:
    Type: String
    MaxLength: 64
    AllowedPattern: ^$|^[a-z0-9][a-z0-9._-]{0,63}$
    Default: ''
  FiscalAccessApprovalId:
    Type: String
    MaxLength: 64
    AllowedPattern: ^$|^[a-z0-9][a-z0-9._-]{0,63}$
    Default: ''
  CommerceCursorSigningKey:
    Type: String
    NoEcho: true
    MinLength: 43
    MaxLength: 128
    AllowedPattern: ^(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-][AQgw]|[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048])?$
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_.-]+$'

Mappings:
  IntegrationsStageByEnvironment:
    test:
      Stage: test
    production:
      Stage: production

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON
      LogGroup:
        Ref: CommerceLogGroup
    Tags:
      Project: Zoolandingpage
      Component: Commerce
      ManagedBy: SAM
      Environment:
        Ref: EnvironmentName

Resources:
  CommerceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /zoolanding/commerce/${EnvironmentName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: Commerce
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-api
      StageName:
        Ref: EnvironmentName
      MethodSettings:
        - HttpMethod: POST
          ResourcePath: /~1features~1commerce~1public-read
          MetricsEnabled: true
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
        - HttpMethod: POST
          ResourcePath: /~1features~1commerce~1public-action
          MetricsEnabled: true
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        - HttpMethod: POST
          ResourcePath: /~1features~1commerce~1fiscal~1request
          MetricsEnabled: true
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      Tags:
        Project: Zoolandingpage
        Component: Commerce
        ManagedBy: SAM
        Environment:
          Ref: EnvironmentName

  CommerceApiIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/services/commerce/api-id
      Type: String
      Value:
        Ref: CommerceApi
      Description: Published Commerce API identifier for trusted routing.

  CommerceCatalogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: duePartition
          AttributeType: S
        - AttributeName: dueKey
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ReservationDueIndex
          KeySchema:
            - AttributeName: duePartition
              KeyType: HASH
            - AttributeName: dueKey
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCatalog
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceOperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceOperations
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  FiscalTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceFiscal
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceNotificationRequestsTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceNotifications
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceNotificationRequestsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/topics/commerce-notification-requests-arn
      Type: String
      Value:
        Ref: CommerceNotificationRequestsTopic
      Description: Published ARN for Commerce notification requests.

  CommerceIntegrationsCallerRoleArnsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/services/commerce/integrations-caller-role-arns
      Type: StringList
      Value:
        Fn::Join:
          - ','
          - - Fn::GetAtt:
                - CatalogActionRole
                - Arn
            - Fn::GetAtt:
                - CheckoutRole
                - Arn
            - Fn::GetAtt:
                - SubscriptionActionRole
                - Arn
            - Fn::GetAtt:
                - ReservationReconcilerRole
                - Arn
      Description: Published ARNs for exact Commerce roles allowed to invoke Integrations.

  CommerceIntegrationEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceIntegrationEventsDlq
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceIntegrationEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - CommerceIntegrationEventsDlq
            - Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceIntegrationEvents
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceOutboxFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceOutboxFailure
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceIntegrationEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: CommerceIntegrationEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
                - CommerceIntegrationEventsQueue
                - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Ref: IntegrationEventsTopicArn
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId

  CommerceIntegrationEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
          - CommerceIntegrationEventsQueue
          - Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageBody
      FilterPolicy:
        eventType:
          - commerce.payment.succeeded.v1
          - commerce.payment.terminal_unpaid.v1
          - commerce.refund.confirmed.v1
          - commerce.subscription.updated.v1
          - migration.preview_ready.v1
          - migration.progressed.v1
          - migration.item_needs_review.v1
          - migration.completed.v1
      TopicArn:
        Ref: IntegrationEventsTopicArn

  IntegrationEventWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceIntegrationEventWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - CommerceIntegrationEventsQueue
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - CommerceCatalogTable
                      - Arn
                  - Fn::GetAtt:
                      - CommerceOperationsTable
                      - Arn
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceIntegrationEvents
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  OutboxRelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceOutboxRelay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  Fn::GetAtt:
                    - CommerceOperationsTable
                    - StreamArn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - CommerceOperationsTable
                    - Arn
              - Effect: Allow
                Action: sns:Publish
                Resource:
                  Ref: CommerceNotificationRequestsTopic
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - CommerceOutboxFailureQueue
                    - Arn
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceOutboxRelay
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CatalogPublicReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceCatalogPublicRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  Fn::GetAtt:
                    - CommerceCatalogTable
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCatalogPublicRead
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CatalogReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceCatalogRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  Fn::GetAtt:
                    - CommerceCatalogTable
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/auth-profile-registry.json
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCatalogRead
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CatalogActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceCatalogAction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - CommerceCatalogTable
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::GetAtt:
                    - CommerceOperationsTable
                    - Arn
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - CommerceCatalogTable
                      - Arn
                  - Fn::GetAtt:
                      - CommerceOperationsTable
                      - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/auth-profile-registry.json
              - Effect: Allow
                Action: execute-api:Invoke
                Resource:
                  - Fn::Sub:
                      - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntegrationsApiId}/${IntegrationsStage}/POST/internal/v1/stripe/offer
                      - IntegrationsStage: { Fn::FindInMap: [IntegrationsStageByEnvironment, { Ref: EnvironmentName }, Stage] }
                  - Fn::Sub:
                      - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntegrationsApiId}/${IntegrationsStage}/POST/internal/v1/stripe/product-presentation
                      - IntegrationsStage: { Fn::FindInMap: [IntegrationsStageByEnvironment, { Ref: EnvironmentName }, Stage] }
                  - Fn::Sub:
                      - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntegrationsApiId}/${IntegrationsStage}/POST/internal/v1/stripe/discount
                      - IntegrationsStage: { Fn::FindInMap: [IntegrationsStageByEnvironment, { Ref: EnvironmentName }, Stage] }
                  - Fn::Sub:
                      - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntegrationsApiId}/${IntegrationsStage}/POST/internal/v1/stripe/discount-lifecycle
                      - IntegrationsStage: { Fn::FindInMap: [IntegrationsStageByEnvironment, { Ref: EnvironmentName }, Stage] }
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCatalogAction
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  InventoryActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceInventoryAction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - CommerceCatalogTable
                      - Arn
                  - Fn::GetAtt:
                      - CommerceOperationsTable
                      - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/auth-profile-registry.json
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceInventoryAction
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CheckoutRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceCheckout
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - CommerceCatalogTable
                      - Arn
                  - Fn::GetAtt:
                      - CommerceOperationsTable
                      - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
                  - Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/notification-policies.json
              - Effect: Allow
                Action: execute-api:Invoke
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${IntegrationsApiId}/${IntegrationsStage}/POST/internal/v1/stripe/checkout
                    - IntegrationsStage: { Fn::FindInMap: [IntegrationsStageByEnvironment, { Ref: EnvironmentName }, Stage] }
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCheckout
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  SubscriptionActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceSubscriptionAction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
