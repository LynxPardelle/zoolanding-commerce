        - Key: Environment
          Value:
            Ref: EnvironmentName

  ReservationReconcilerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceReservationReconciler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  Fn::Sub:
                    - ${CatalogArn}/index/ReservationDueIndex
                    - CatalogArn:
                        Fn::GetAtt:
                          - CommerceCatalogTable
                          - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - CommerceCatalogTable
                      - Arn
                  - Fn::GetAtt:
                      - CommerceOperationsTable
                      - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceReservationReconciler
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

