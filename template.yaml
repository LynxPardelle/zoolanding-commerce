  IntegrationEventWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.integration_event_worker.lambda_handler
      Description: Applies normalized confirmed integration events idempotently.
      Role:
        Fn::GetAtt:
          - IntegrationEventWorkerRole
          - Arn
      Environment:
        Variables:
          COMMERCE_CATALOG_TABLE_NAME:
            Ref: CommerceCatalogTable
          COMMERCE_OPERATIONS_TABLE_NAME:
            Ref: CommerceOperationsTable
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
      Events:
        IntegrationEvents:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - CommerceIntegrationEventsQueue
                - Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  OutboxRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.outbox_relay.lambda_handler
      Description: Publishes pending notification outbox records to the fixed topic.
      Role:
        Fn::GetAtt:
          - OutboxRelayRole
          - Arn
      Environment:
        Variables:
          COMMERCE_CATALOG_TABLE_NAME:
            Ref: CommerceCatalogTable
          COMMERCE_OPERATIONS_TABLE_NAME:
            Ref: CommerceOperationsTable
          NOTIFICATION_TOPIC_ARN:
            Ref: CommerceNotificationRequestsTopic
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
      Events:
        OperationsOutbox:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - CommerceOperationsTable
                - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"itemType":{"S":["Outbox"]},"deliveryStatus":{"S":["pending"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - CommerceOutboxFailureQueue
                    - Arn

  ReservationReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.reservation_reconciler.lambda_handler
      Description: Reconciles due reservations without releasing on uncertain evidence.
      Role:
        Fn::GetAtt:
          - ReservationReconcilerRole
          - Arn
      Environment:
        Variables:
          COMMERCE_CATALOG_TABLE_NAME:
            Ref: CommerceCatalogTable
          COMMERCE_OPERATIONS_TABLE_NAME:
            Ref: CommerceOperationsTable
          CONFIG_REGISTRY_TABLE_NAME:
            Ref: ConfigRegistryTableName
          CONFIG_PAYLOADS_BUCKET_NAME:
            Ref: ConfigPayloadsBucketName
          ENVIRONMENT_NAME:
            Ref: EnvironmentName
          RESERVATION_DUE_INDEX_NAME: ReservationDueIndex
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: false

Outputs:
  ApiUrl:
    Description: Commerce API base URL.
    Value:
      Fn::Sub: https://${CommerceApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
  CatalogTableName:
    Description: Commerce Catalog DynamoDB table name.
    Value:
      Ref: CommerceCatalogTable
  OperationsTableName:
    Description: Commerce Operations DynamoDB table name.
    Value:
      Ref: CommerceOperationsTable
  NotificationRequestsTopicArn:
    Description: Commerce notification request topic ARN.
    Value:
      Ref: CommerceNotificationRequestsTopic
