AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic draft-scoped Commerce service.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - test
      - prod
  ConfigRegistryTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  ConfigPayloadsBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
  AuthSessionTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  AuthUserStateTableName:
    Type: String
    MinLength: 3
    MaxLength: 255
    AllowedPattern: ^[A-Za-z0-9_.-]+$
  IntegrationEventsTopicArn:
    Type: String
    AllowedPattern: ^arn:[A-Za-z0-9-]+:sns:[A-Za-z0-9-]+:[0-9]{12}:[A-Za-z0-9_.-]+$
  FiscalProductionApproved:
    Type: String
    AllowedValues:
      - 'false'
      - 'true'
    Default: 'false'
  FiscalRetentionApprovalId:
    Type: String
    MaxLength: 64
    AllowedPattern: ^$|^[a-z0-9][a-z0-9._-]{0,63}$
    Default: ''
  FiscalAccessApprovalId:
    Type: String
    MaxLength: 64
    AllowedPattern: ^$|^[a-z0-9][a-z0-9._-]{0,63}$
    Default: ''
  CommerceCursorSigningKey:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: ^(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-][AQgw]|[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048])?$

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON
      LogGroup:
        Ref: CommerceLogGroup
    Tags:
      Project: Zoolandingpage
      Component: Commerce
      ManagedBy: SAM
      Environment:
        Ref: EnvironmentName

Resources:
  CommerceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /zoolanding/commerce/${EnvironmentName}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: Commerce
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: EnvironmentName
      MethodSettings:
        - HttpMethod: POST
          ResourcePath: /~1features~1commerce~1public-read
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
        - HttpMethod: POST
          ResourcePath: /~1features~1commerce~1public-action
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        - HttpMethod: POST
          ResourcePath: /~1features~1commerce~1fiscal~1request
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      Tags:
        Project: Zoolandingpage
        Component: Commerce
        ManagedBy: SAM
        Environment:
          Ref: EnvironmentName

  CommerceCatalogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: duePartition
          AttributeType: S
        - AttributeName: dueKey
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ReservationDueIndex
          KeySchema:
            - AttributeName: duePartition
              KeyType: HASH
            - AttributeName: dueKey
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCatalog
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceOperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceOperations
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  FiscalTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceFiscal
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceNotificationRequestsTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceNotifications
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceIntegrationEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceIntegrationEventsDlq
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceIntegrationEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - CommerceIntegrationEventsDlq
            - Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceIntegrationEvents
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceOutboxFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceOutboxFailure
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  CommerceIntegrationEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - Ref: CommerceIntegrationEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              Fn::GetAtt:
                - CommerceIntegrationEventsQueue
                - Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  Ref: IntegrationEventsTopicArn

  CommerceIntegrationEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      Endpoint:
        Fn::GetAtt:
          - CommerceIntegrationEventsQueue
          - Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageBody
      FilterPolicy:
        eventType:
          - commerce.payment.succeeded.v1
          - commerce.payment.terminal_unpaid.v1
          - commerce.refund.confirmed.v1
          - commerce.subscription.updated.v1
      TopicArn:
        Ref: IntegrationEventsTopicArn

  IntegrationEventWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceIntegrationEventWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - CommerceIntegrationEventsQueue
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt:
                      - CommerceCatalogTable
                      - Arn
                  - Fn::GetAtt:
                      - CommerceOperationsTable
                      - Arn
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceIntegrationEvents
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

  OutboxRelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceOutboxRelay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - CommerceLogGroup
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  Fn::Sub:
                    - ${OperationsArn}/stream/*
                    - OperationsArn:
                        Fn::GetAtt:
                          - CommerceOperationsTable
                          - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - CommerceOperationsTable
                    - Arn
              - Effect: Allow
                Action: sns:Publish
                Resource:
                  Ref: CommerceNotificationRequestsTopic
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - CommerceOutboxFailureQueue
                    - Arn
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceOutboxRelay
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

