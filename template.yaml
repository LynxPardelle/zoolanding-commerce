Outputs:
  ApiUrl:
    Description: Commerce API base URL.
    Value:
      Fn::Sub: https://${CommerceApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}
  CatalogTableName:
    Description: Commerce Catalog DynamoDB table name.
    Value:
      Ref: CommerceCatalogTable
  OperationsTableName:
    Description: Commerce Operations DynamoDB table name.
    Value:
      Ref: CommerceOperationsTable
  NotificationRequestsTopicArn:
    Description: Commerce notification request topic ARN.
    Value:
      Ref: CommerceNotificationRequestsTopic
  CommerceApiIdParameterName:
    Description: SSM parameter containing the Commerce API identifier.
    Value:
      Ref: CommerceApiIdParameter
  NotificationRequestsTopicArnParameterName:
    Description: SSM parameter containing the Commerce notification topic ARN.
    Value:
      Ref: CommerceNotificationRequestsTopicArnParameter
  IntegrationsCallerRoleArnsParameterName:
    Description: SSM parameter containing exact Commerce Integrations caller role ARNs.
    Value:
      Ref: CommerceIntegrationsCallerRoleArnsParameter
