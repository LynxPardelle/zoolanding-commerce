            Fn::GetAtt: [CommerceIntegrationEventsQueue, QueueName]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
