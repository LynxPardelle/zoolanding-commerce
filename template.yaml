                    - CommerceCatalogTable
                    - Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: CommerceCatalogPublicRead
        - Key: CostCenter
          Value: Commerce
        - Key: ManagedBy
          Value: SAM
        - Key: Environment
          Value:
            Ref: EnvironmentName

